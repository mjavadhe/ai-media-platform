[project]
name = "ai-media-platform"
version = "0.1.0"
description = "AI Media Generation & GPU Orchestration Platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "python-multipart>=0.0.17",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "pyjwt>=2.10",
    "itsdangerous>=2.2",
    "structlog>=24.4",
    "httpx>=0.28",
    "sse-starlette>=2.1",
    "orjson>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-passlib>=1.7",
    "testcontainers>=4.9",
]

[project.scripts]
app-api = "app.main:run"
app-scheduler = "app.scheduler.runner:run"
app-worker = "worker.agent:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/app", "worker/src/worker"]
# Explicit editable-mode roots so `app` and `worker` are importable from a plain
# `uv run` without PYTHONPATH juggling (both live in separate src roots).
dev-mode-dirs = ["backend/src", "worker/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend/src", "worker/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S", "BLE", "A", "PTH", "TID"]
ignore = [
    "S101",  # assert is fine in tests
    "B008",
    "RUF001",
    "RUF002",
    "RUF003",
    "A003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802", "N803"]
"backend/src/app/persistence/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]
mypy_path = "backend/src:worker/src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["backend/src", "worker/src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: pure unit tests, no database",
    "integration: requires PostgreSQL",
    "e2e: full end-to-end orchestration flows",
    "needs_gpu: requires real NVIDIA hardware",
]
filterwarnings = ["ignore::DeprecationWarning"]
